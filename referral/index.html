<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iGotUp · Minhas Indicações</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="ref">
  <main class="ref-wrap">
    <div class="ref-head">
      <div class="ref-brand">
        <img class="brand-mark" src="img/logo-clear.png" alt="iGotUp" />
        <div>
          <strong>Minhas Indicações</strong>
          <span>Painel do indicador</span>
        </div>
      </div>
      <div class="ref-user" id="refUser"></div>
    </div>

    <!-- Estado de carregamento / erro -->
    <div id="refStatus" class="ref-status" hidden></div>

    <!-- Painel principal -->
    <div id="refPanel" hidden>
      <!-- Stats -->
      <div class="cards" id="statsCards"></div>

      <!-- Nível / wallet -->
      <div class="panel progress-panel">
        <div class="progress-head">
          <div>
            <span class="muted small">Seu nível</span>
            <div><span class="level-badge" id="cliLevel"></span> <span class="xp-chip" id="cliXp"></span></div>
          </div>
          <div class="wallet-chip">
            <span class="muted small">Comissões</span>
            <strong id="cliWallet"></strong>
          </div>
        </div>
        <div class="muted small" id="cliProgressLabel"></div>
      </div>

      <!-- Materiais -->
      <div class="panel">
        <h3>Seus materiais de indicação</h3>
        <div class="grid-2">
          <div class="material">
            <label>Código de indicação</label>
            <div class="copy-row"><input type="text" id="cliCupom" readonly /><button class="btn btn-ghost btn-copy" data-copy="cliCupom">Copiar</button></div>
          </div>
          <div class="material">
            <label>Link de indicação</label>
            <div class="copy-row"><input type="text" id="cliLink" readonly /><button class="btn btn-ghost btn-copy" data-copy="cliLink">Copiar</button></div>
          </div>
        </div>
        <p class="hint" id="cliHint"></p>
      </div>

      <!-- Nova indicação -->
      <div class="panel">
        <h3>Fazer uma indicação</h3>
        <div class="grid-2">
          <label>Nome do convidado <input type="text" id="refName" placeholder="Nome completo" /></label>
          <label>WhatsApp do convidado <input type="text" id="refContact" placeholder="(51) 99999-9999" /></label>
        </div>
        <button class="btn btn-primary btn-block" id="btnSubmitReferral">Enviar indicação</button>
        <p class="hint ok" id="formMsg" hidden></p>
      </div>

      <!-- Minhas indicações -->
      <div class="panel">
        <div class="panel-head"><h3>Minhas indicações</h3><span class="muted" id="cliRefCount"></span></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Convidado</th><th>WhatsApp</th><th>Data</th><th>Status</th><th>Comissão</th></tr></thead><tbody id="cliRefRows"></tbody></table></div>
        <p class="hint" id="cliEmpty"></p>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../supabase/config.js"></script>
  <script src="../supabase/supabase-client.js"></script>
  <script src="../supabase/data-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
